[package]
name = "cw-native-host"
version = "0.1.0"
edition = "2021"
description = "CreatorWeave Native Host — disk executor via Chrome Native Messaging"

[[bin]]
name = "cw-native-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS-only: NSOpenPanel for pick_folder
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSLocale", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSPanel",
    "NSOpenPanel",
    "NSSavePanel",
    "NSWindow",
    "NSResponder",
    "NSView",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
