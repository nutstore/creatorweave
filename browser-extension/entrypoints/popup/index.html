<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>eo2weave</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      flex-direction: column;
    }
    .header {
      gap: 10px;
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, #14B8A6, #0D9488);
      color: #fff;
    }
    .title-wrap {
      flex: 1;
      min-width: 0;
    }
    .title {
      font-size: 15px;
      line-height: 1.2;
    }
    .subtitle {
      margin-top: 2px;
      font-size: 11px;
      opacity: 0.92;
    }
    .build-mode {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.12);
    }
    .build-mode.dev { color: #fef3c7; }
    .build-mode.prod { color: #dcfce7; }
    .main {
      padding: 14px 16px 16px;
      flex-direction: column;
      gap: 12px;
    }
    .status {
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #e2e8f0;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #94a3b8;
      flex: 0 0 auto;
    }
    .status.active .status-dot { background: #22c55e; }
    .status.inactive .status-dot { background: #f59e0b; }
    .status.disabled .status-dot { background: #94a3b8; }
    .status-text { font-size: 12px; color: #334155; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: #e2e8f0;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 11px;
    }
    .codex-box {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
    }
    .codex-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #0f766e;
      color: #fff;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .codex-btn.secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .codex-log {
      margin-top: 10px;
      white-space: pre-wrap;
      font-size: 11px;
      line-height: 1.5;
      color: #475569;
      max-height: 120px;
      overflow: auto;
    }
    .reset-credit-box {
      display: none;
      margin-bottom: 10px;
      padding: 8px 10px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
    }
    .reset-credit-summary {
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: #92400e;
    }
    .reset-credit-meta {
      margin-top: 4px;
      font-size: 10px;
      color: #a16207;
    }
    .reset-credit-btn {
      width: auto;
      margin-top: 8px;
      padding: 6px 9px;
      background: #d97706;
      font-size: 11px;
    }
    a { color: #0f766e; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .footer {
      gap: 8px;
      margin-top: 4px;
    }
    .footer-link {
      flex: 1;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #334155;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .footer-link:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    /* WebMCP discovered tools (mirrors the web app's Settings → WebMCP host list) */
    .webmcp-box {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .webmcp-summary {
      font-size: 11px;
      font-weight: 600;
      color: #0f766e;
      margin-bottom: 6px;
    }
    .webmcp-host {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .webmcp-host:hover {
      background: #f0fdfa;
    }
    .webmcp-host-name {
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #334155;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .webmcp-host-count {
      flex: 0 0 auto;
      font-size: 10px;
      font-weight: 600;
      color: #0f766e;
      background: #f0fdfa;
      border: 1px solid #ccfbf1;
      border-radius: 999px;
      padding: 1px 7px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="title-wrap">
      <div class="title">eo2weave</div>
      <div class="subtitle" data-i18n="popupSubtitle">网页搜索与内容抓取服务</div>
    </div>
    <div id="buildMode" class="build-mode" hidden></div>
  </header>

  <main class="main">
    <div id="webmcpBox" class="webmcp-box" style="display:none">
      <div id="webmcpSummary" class="webmcp-summary">Scanning tabs…</div>
      <div id="webmcpList"></div>
    </div>
    <div class="status" id="status">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText" data-i18n="checking">检测中…</span>
    </div>
    <div class="codex-box">
      <div id="codexStatus" style="margin-bottom: 8px; font-size: 12px; color: #6b7280;">
        <span id="codexStatusDot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#d1d5db;vertical-align:middle;margin-right:6px;"></span>
        <span id="codexStatusText" data-i18n="checkingAuthStatus">Checking auth status…</span>
      </div>

      <div id="codexUsage" style="display:none; margin-bottom: 10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <div style="font-size: 11px; font-weight: 600; color: #374151;" data-i18n="codexUsage">Codex Usage</div>
          <span id="usagePlan" style="font-size:10px;padding:1px 6px;border-radius:4px;background:#f0fdfa;color:#0d9488;font-weight:500;"></span>
        </div>
        <div id="usagePrimary" style="margin-bottom: 6px;"></div>
        <div id="usageSecondary" style="margin-bottom: 4px;"></div>
        <div id="usageUpdated" style="font-size: 10px; color: #9ca3af;"></div>
      </div>

      <div id="resetCreditBox" class="reset-credit-box">
        <div class="reset-credit-summary">
          <span data-i18n="resetCreditsAvailable">手动重置额度</span>
          <strong id="resetCreditCount"></strong>
        </div>
        <div id="resetCreditMeta" class="reset-credit-meta"></div>
        <button id="resetCreditBtn" class="codex-btn reset-credit-btn" data-i18n="useResetCredit">使用一次重置</button>
      </div>

      <div id="deviceCodeBox" style="display:none; margin-bottom: 10px; padding: 8px 10px; background: #f0fdfa; border: 1px solid #ccfbf1; border-radius: 8px;">
        <div style="font-size: 10px; color: #6b7280; margin-bottom: 4px;" data-i18n="deviceCode">Device Code</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <code id="deviceCodeText" style="flex: 1; font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #0d9488; font-family: 'SF Mono', 'Fira Code', monospace;"></code>
          <button id="copyCodeBtn" style="border: none; background: none; cursor: pointer; padding: 2px 6px; color: #6b7280; font-size: 11px; border-radius: 4px; transition: all 0.15s;" data-i18n-title="copyCode" title="Copy code">📋</button>
        </div>
        <div id="deviceCodeLink" style="font-size: 10px; margin-top: 4px;"></div>
      </div>

      <button id="codexLoginBtn" class="codex-btn" data-i18n="startDeviceCodeLogin">Start Device Code Login</button>
      <button id="codexResetBtn" class="codex-btn secondary" data-i18n="resetLogin">重新开始（清除状态）</button>
      <div id="codexLog" class="codex-log"></div>
    </div>

    <footer class="footer">
      <button id="openDocs" class="footer-link" data-i18n="documentation">使用文档</button>
      <button id="openGithub" class="footer-link" data-i18n="github">GitHub</button>
    </footer>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
